# Nginx config for Kyerease (twi-translator) at test.graviticreatives.com
# Deploy: ./scripts/deploy-kyerease.sh (includes this) or ./scripts/deploy-nginx-ssl.sh
# SSL certs: /etc/letsencrypt/live/test.graviticreatives.com/ (certbot)
#
# IMPORTANT: Add the following line to your http {} block in nginx.conf:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name test.graviticreatives.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.graviticreatives.com;

    ssl_certificate /etc/letsencrypt/live/test.graviticreatives.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.graviticreatives.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Main app (Vite build output)
    root /home/keyerease/kyerease-app/dist;
    index index.html;

    # Admin portal at /portal/ (^~ = take precedence over regex locations below)
    location = /portal {
        return 301 $scheme://$host/portal/;
    }
    location ^~ /portal/ {
        alias /home/keyerease/kyerease-app/dist-portal/;
        error_page 404 = /portal/index.html;
    }

    # API proxy to backend (Node/Express on port 3001)
    # client_max_body_size: allow audio uploads up to 25MB (multer limit)
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 26M;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
