# Nginx config for Kyerease (twi-translator) at test.graviticreatives.com
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
# sudo ln -sf /etc/nginx/sites-available/test.graviticreatives.com.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# SSL: sudo certbot --nginx -d test.graviticreatives.com

server {
    listen 80;
    listen [::]:80;
    server_name test.graviticreatives.com;

    # Frontend (Vite build output)
    root /home/keyerease/kyerease-app/dist;
    index index.html;

    # API proxy to backend (Node/Express on port 3001)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
